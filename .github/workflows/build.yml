name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    # The image job reuses the version resolved here, so the tag and the
    # compiled-in value can never disagree.
    outputs:
      version: ${{ steps.ver.outputs.version }}
      minor: ${{ steps.ver.outputs.minor }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # VERSION is the single source of truth for the release number. Reading
      # it here means the binary, the panel footer and the image tag all agree,
      # instead of the panel reporting the branch name.
      - name: Resolve version
        id: ver
        run: |
          version=$(tr -d ' \t\r\n' < VERSION)
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "VERSION must be MAJOR.MINOR.PATCH, got: '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
          echo "resolved $version"

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        # The version is normally injected by the linker, so the test build has
        # to supply it too; otherwise anything reading main.version would see
        # the "dev" fallback and not what a release actually ships.
        run: go test -race -ldflags "-X main.version=${{ steps.ver.outputs.version }}" ./...

      - name: Check the panel reports this version
        run: |
          version=$(tr -d ' \t\r\n' < VERSION)
          go run -ldflags "-X main.version=$version" ./cmd/server -version | grep -Fx "$version"

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Only authenticate when we intend to publish. Pull requests build the
      # image to prove it compiles, but never push.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # VERSION drives the published tags, so pulling a specific release
            # is possible and the running version is identifiable. latest keeps
            # tracking the default branch for unattended redeploys.
            type=raw,value=${{ needs.test.outputs.version }}
            type=raw,value=${{ needs.test.outputs.minor }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.test.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
