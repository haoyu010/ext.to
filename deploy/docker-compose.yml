# Deployment for fnOS (飞牛) / any Docker host.
#
#   1. Copy docker-compose.yml to a folder, for example /vol1/1000/docker/extto
#   2. docker compose up -d
#   3. Open http://<host-ip>:8090 and sign in with admin / admin
#   4. Fill in the Telegram and ext.to settings, then press Save

services:
  extto:
    image: ghcr.io/haoyu010/ext.to:latest
    container_name: ext-to-forwarder
    restart: unless-stopped
    ports:
      # The dashboard is exposed unauthenticated-by-default, so it is bound to
      # the LAN interface only. Remove the IP part to expose it on all
      # interfaces.
      - "8090:8080"
    volumes:
      # Holds config.json (settings) and state.json (delivery history).
      - ./data:/data
    environment:
      - TZ=Asia/Shanghai
      # Ownership applied to ./data before the server starts. Set these to the
      # uid:gid that own the folder on the host (run `id` over SSH to check;
      # fnOS users are typically 1000:1000).
      - PUID=1000
      - PGID=1000
      # Change the listener or data directory here if needed.
      # - ADDR=:8080
      # - DATA_DIR=/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - flaresolverr

  # Cloudflare clearance cookie harvester.
  #
  # cf_clearance is bound to the client IP, so the container that solves the
  # challenge has to share the forwarder's egress address. Running it here
  # rather than on another host is what makes the cookie replayable, and the
  # service name gives the forwarder a stable address to call.
  #
  # Only reachable from the compose network: no ports are published, because
  # the solver drives a real browser and must not be exposed.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: ext-to-flaresolverr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=warning
      - LOG_HTML=false
      # The ext.to challenge is a managed challenge, which this solver passes
      # on its own; an external CAPTCHA service is not needed.
      - CAPTCHA_SOLVER=none
      - TZ=Asia/Shanghai
    # Chromium needs more shared memory than the 64 MB default, or it crashes
    # partway through a solve and the forwarder sees a connection reset.
    shm_size: 512mb
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
